<svg xmlns="http://www.w3.org/2000/svg" width="860" height="365" viewBox="0 0 860 365" role="img" aria-label="System Dashboard: sca4s">
  <rect width="860" height="365" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1" />
  <rect width="860" height="38" fill="#161b22" rx="12" />
  <rect y="26" width="860" height="12" fill="#161b22" />
  <line x1="0" y1="38" x2="860" y2="38" stroke="#30363d" />
  
  <!-- Window buttons -->
  <circle cx="22" cy="19" r="6" fill="#ff5f57" />
  <circle cx="42" cy="19" r="6" fill="#febc2e" />
  <circle cx="62" cy="19" r="6" fill="#28c840" />
  <text x="430" y="24" fill="#8b949e" font-family="monospace" font-size="12" text-anchor="middle">sys-monitor // sca4s@core</text>

  <!-- Top Info -->
  <text x="32" y="72" fill="#58a6ff" font-family="monospace" font-size="13" font-weight="bold">HOST:</text>
  <text x="90" y="72" fill="#c9d1d9" font-family="monospace" font-size="13">sca4s-station</text>
  
  <text x="280" y="72" fill="#58a6ff" font-family="monospace" font-size="13" font-weight="bold">UPTIME:</text>
  <text x="350" y="72" fill="#c9d1d9" font-family="monospace" font-size="13">99.9% online</text>

  <text x="540" y="72" fill="#58a6ff" font-family="monospace" font-size="13" font-weight="bold">STATUS:</text>
  <text x="610" y="72" fill="#00ff87" font-family="monospace" font-size="13">BUILDING_</text>

  <line x1="32" y1="92" x2="828" y2="92" stroke="#21262d" stroke-width="2" />

  <!-- Left Meters -->
  <text x="32" y="125" fill="#8b949e" font-family="monospace" font-size="12">CPU Usage [Java / Python / Web]</text>
