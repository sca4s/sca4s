<svg xmlns="http://www.w3.org/2000/svg" width="860" height="365" viewBox="0 0 860 365" role="img" aria-label="System Dashboard: sca4s">
  <defs>
    <clipPath id="win"><rect width="860" height="365" rx="12" /></clipPath>
    <linearGradient id="bar-cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="bar-purple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b174ff" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>
    <linearGradient id="bar-green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff87" />
      <stop offset="100%" stop-color="#60efff" />
    </linearGradient>
  </defs>

  <g clip-path="url(#win)">
    <!-- Terminal Background & Window Header -->
    <rect width="860" height="365" fill="#0d1117" />
    <rect width="860" height="38" fill="#161b22" />
    <line x1="0" y1="38" x2="860" y2="38" stroke="#30363d" />
    <circle cx="22" cy="19" r="6" fill="#ff5f57" />
    <circle cx="42" cy="19" r="6" fill="#febc2e" />
    <circle cx="62" cy="19" r="6" fill="#28c840" />
    <text x="430" y="23.5" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, &#39;SF Mono&#39;, Menlo, Consolas, monospace" font-size="12.5" text-anchor="middle">sys-monitor // sca4s@core</text>

    <!-- Dashboard Header Info -->
    <g font-family="ui-monospace, SFMono-Regular, &#39;SF Mono&#39;, Menlo, Consolas, monospace" font-size="13">
      <text x="32" y="72" fill="#58a6ff" font-weight="bold">HOST:</text>
      <text x="90" y="72" fill="#c9d1d9">sca4s-station</text>
      
      <text x="280" y="72" fill="#58a6ff" font-weight="bold">UPTIME:</text>
      <text x="350" y="72" fill="#c9d1d9">99.9% online</text>

      <text x="540" y="72" fill="#58a6ff" font-weight="bold">STATUS:</text>
      <text x="610" y="72" fill="#00ff87">BUILDING_</text>
    </g>

    <!-- Separator Line -->
    <line x1="32" y1="92" x2="828" y2="92" stroke="#21262d" stroke-width="2" />

    <!-- Left Column: System Specs & Meters -->
    <g font-family="ui-monospace, SFMono-Regular, &#39;SF Mono&#39;, Menlo, Consolas, monospace" font-size="12">
      <!-- CPU Load -->
      <text x="32" y="125" fill="#8b949e">CPU Usage [Java / Python / Web]</text>
      <text x="380" y="125" fill="#00f2fe">74%</text>
      <rect x="32" y="135" width="390" height="8" rx="4" fill="#21262d" />
      <rect x="32" y="135" width="290" height="8" rx="4" fill="url(#bar-cyan)" />

      <!-- Memory Load -->
      <text x="32" y="170" fill="#8b949e">Memory [Assets & Repositories]</text>
      <text x="380" y="170" fill="#b174ff">4.2 / 8.0 GB</text>
      <rect x="32" y="180" width="390" height="8" rx="4" fill="#21262d" />
      <rect x="32" y="180" width="210" height="8" rx="4" fill="url(#bar-purple)" />

      <!-- Network Load -->
      <text x="32" y="215" fill="#8b949e">Network [GitHub & Deployments]</text>
      <text x="380" y="215" fill="#00ff87">100 Mbps</text>
      <rect x="32" y="225" width="390" height="8" rx="4" fill="#21262d" />
      <rect x="32" y="225" width="330" height="8" rx="4" fill="url(#bar-green)" />
    </g>

    <!-- Right Column: Active Stack & Projects Box -->
    <g transform="translate(460, 105)">
      <rect width="368" height="210" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
      
      <text x="20" y="30" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, &#39;SF Mono&#39;, Menlo, Consolas, monospace" font-size="13" font-weight="bold">> active_stack.json</text>
      
      <g font-family="ui-monospace, SFMono-Regular, &#39;SF Mono&#39;, Menlo, Consolas, monospace" font-size="12" fill="#c9d1d9">
        <text x="20" y="65" fill="#8b949e">01</text>
        <text x="50" y="65"><tspan fill="#ff7b72">"engine"</tspan>: <tspan fill="#79c0ff">"Java / Python"</tspan></text>

        <text x="20" y="95" fill="#8b949e">02</text>
        <text x="50" y="95"><tspan fill="#ff7b72">"frontend"</tspan>: <tspan fill="#79c0ff">"HTML / CSS"</tspan></text>

        <text x="20" y="125" fill="#8b949e">03</text>
        <text x="50" y="125"><tspan fill="#ff7b72">"story"</tspan>: <tspan fill="#79c0ff">"Visuals & Code"</tspan></text>

        <text x="20" y="155" fill="#8b949e">04</text>
        <text x="50" y="155"><tspan fill="#ff7b72">"location"</tspan>: <tspan fill="#79c0ff">"Kolkata, IN"</tspan></text>

        <text x="20" y="185" fill="#8b949e">05</text>
        <text x="50" y="185"><tspan fill="#ff7b72">"profile"</tspan>: <tspan fill="#79c0ff">"github.com/sca4s"</tspan></text>
      </g>
    </g>

    <!-- Bottom Status Bar -->
    <rect y="330" width="860" height="35" fill="#161b22" />
    <line x1="0" y1="330" x2="860" y2="330" stroke="#30363d" />
    <text x="32" y="352" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, &#39;SF Mono&#39;, Menlo, Consolas, monospace" font-size="11">F1: help  F2: config  F4: quit  :: Press [Space] to toggle mode</text>
    
    <!-- Static Indicator Dot -->
    <circle cx="828" cy="347" r="4" fill="#00ffcc" />
  </g>
  <rect x="0.5" y="0.5" width="859" height="364" rx="11.5" fill="none" stroke="#30363d" />
</svg>
