  <rect x="32" y="135" width="390" height="8" rx="4" fill="#21262d" />
  <rect x="32" y="135" width="290" height="8" rx="4" fill="#00f2fe" />

  <text x="32" y="170" fill="#8b949e" font-family="monospace" font-size="12">Memory [Assets & Repositories]</text>
  <text x="380" y="170" fill="#b174ff" font-family="monospace" font-size="12">4.2 / 8.0 GB</text>
  <rect x="32" y="180" width="390" height="8" rx="4" fill="#21262d" />
  <rect x="32" y="180" width="210" height="8" rx="4" fill="#b174ff" />

  <text x="32" y="215" fill="#8b949e" font-family="monospace" font-size="12">Network [GitHub & Deployments]</text>
  <text x="380" y="215" fill="#00ff87" font-family="monospace" font-size="12">100 Mbps</text>
  <rect x="32" y="225" width="390" height="8" rx="4" fill="#21262d" />
  <rect x="32" y="225" width="330" height="8" rx="4" fill="#00ff87" />

  <!-- Right Box -->
  <g transform="translate(460, 105)">
    <rect width="368" height="210" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="20" y="30" fill="#58a6ff" font-family="monospace" font-size="13" font-weight="bold">> active_stack.json</text>
    
    <text x="20" y="65" fill="#8b949e" font-family="monospace" font-size="12">01</text>
    <text x="50" y="65" font-family="monospace" font-size="12"><tspan fill="#ff7b72">"engine"</tspan>: <tspan fill="#79c0ff">"Java / Python"</tspan></text>

    <text x="20" y="95" fill="#8b949e" font-family="monospace" font-size="12">02</text>
    <text x="50" y="95" font-family="monospace" font-size="12"><tspan fill="#ff7b72">"frontend"</tspan>: <tspan fill="#79c0ff">"HTML / CSS"</tspan></text>

    <text x="20" y="125" fill="#8b949e" font-family="monospace" font-size="12">03</text>
    <text x="50" y="125" font-family="monospace" font-size="12"><tspan fill="#ff7b72">"story"</tspan>: <tspan fill="#79c0ff">"Visuals & Code"</tspan></text>

    <text x="20" y="155" fill="#8b949e" font-family="monospace" font-size="12">04</text>
    <text x="50" y="155" font-family="monospace" font-size="12"><tspan fill="#ff7b72">"location"</tspan>: <tspan fill="#79c0ff">"Kolkata, IN"</tspan></text>

    <text x="20" y="185" fill="#8b949e" font-family="monospace" font-size="12">05</text>
    <text x="50" y="185" font-family="monospace" font-size="12"><tspan fill="#ff7b72">"profile"</tspan>: <tspan fill="#79c0ff">"github.com/sca4s"</tspan></text>
  </g>

  <!-- Bottom Bar -->
  <rect y="330" width="860" height="35" fill="#161b22" rx="12" />
  <rect y="330" width="860" height="10" fill="#161b22" />
  <line x1="0" y1="330" x2="860" y2="330" stroke="#30363d" />
  <text x="32" y="352" fill="#8b949e" font-family="monospace" font-size="11">F1: help  F2: config  F4: quit  :: System Online</text>
  <circle cx="828" cy="347" r="4" fill="#00ffcc" />
