<svg xmlns="http://www.w3.org/2000/svg" width="860" height="365" viewBox="0 0 860 365" role="img" aria-label="terminal: Sourish Paul (sca4s), game developer, visual storyteller">
  <defs>
    <clipPath id="win"><rect width="860" height="365" rx="12" /></clipPath>
  </defs>

  <g clip-path="url(#win)">
    <!-- Terminal Background & Titlebar -->
    <rect width="860" height="365" fill="#0b0f14" />
    <rect width="860" height="38" fill="#11161d" />
    <line x1="0" y1="38" x2="860" y2="38" stroke="#262c36" />
    <circle cx="22" cy="19" r="6" fill="#ff5f57" />
    <circle cx="42" cy="19" r="6" fill="#febc2e" />
    <circle cx="62" cy="19" r="6" fill="#28c840" />
    <text x="430" y="23.5" fill="#7d8590" font-family="ui-monospace, SFMono-Regular, &#39;SF Mono&#39;, Menlo, Consolas, &#39;Liberation Mono&#39;, monospace" font-size="12.5" text-anchor="middle">sourish@sca4s: ~</text>

    <!-- Terminal Content & Profile Details -->
    <g font-family="ui-monospace, SFMono-Regular, &#39;SF Mono&#39;, Menlo, Consolas, &#39;Liberation Mono&#39;, monospace" font-size="14">
      <!-- Line 1: whoami -->
      <text x="24.0" y="70" fill="#7ee787">sca4s@dev </text>
      <text x="108.0" y="70" fill="#79c0ff"> ~ </text>
      <text x="133.2" y="70" fill="#7d8590">$ </text>
      <text x="150.0" y="70" fill="#d1d7e0">whoami</text>

      <!-- Line 2: Output -->
      <text x="24.0" y="93" fill="#d1d7e0">sourish paul. game dev & visual storyteller.</text>

      <!-- Line 3: cat side-quests -->
      <text x="24.0" y="116" fill="#7ee787">sca4s@dev </text>
      <text x="108.0" y="116" fill="#79c0ff"> ~ </text>
      <text x="133.2" y="116" fill="#7d8590">$ </text>
      <text x="150.0" y="116" fill="#d1d7e0">cat ~/profile/side-quests.txt | head</text>

      <!-- Line 4: Game Dev -->
      <text x="24.0" y="139" fill="#d1d7e0">game-development   </text>
      <text x="183.6" y="139" fill="#e3b341">★ </text>
      <text x="200.4" y="139" fill="#e3b341">Java · Python · HTML</text>

      <!-- Line 5: Visual Storyteller -->
      <text x="24.0" y="162" fill="#d1d7e0">visual-storyteller </text>
      <text x="183.6" y="162" fill="#e3b341">★ </text>
      <text x="200.4" y="162" fill="#e3b341">Landscape Photo & Video</text>

      <!-- Line 6: Spoken Languages -->
      <text x="24.0" y="185" fill="#d1d7e0">spoken-languages   </text>
      <text x="183.6" y="185" fill="#e3b341">★ </text>
      <text x="200.4" y="185" fill="#e3b341">English · Bengali · Hindi</text>

      <!-- Line 7: current-quest -->
      <text x="24.0" y="208" fill="#7ee787">sca4s@dev </text>
      <text x="108.0" y="208" fill="#79c0ff"> ~ </text>
      <text x="133.2" y="208" fill="#7d8590">$ </text>
      <text x="150.0" y="208" fill="#d1d7e0">cat ~/current-quest.info</text>

      <!-- Line 8: Output -->
      <text x="24.0" y="231" fill="#ffa657">code · cameras     </text>
      <text x="200.4" y="231" fill="#7d8590">mountains & winding rivers</text>

      <!-- Line 9: which dev -->
      <text x="24.0" y="254" fill="#7ee787">sca4s@dev </text>
      <text x="108.0" y="254" fill="#79c0ff"> ~ </text>
      <text x="133.2" y="254" fill="#7d8590">$ </text>
      <text x="150.0" y="254" fill="#d1d7e0">which dev</text>

      <!-- Line 10: Output -->
      <text x="24.0" y="277" fill="#79c0ff">kolkata · github.com/sca4s · in/sca4s</text>

      <!-- Line 11: Final Prompt with Cursor -->
      <text x="24.0" y="300" fill="#7ee787">sca4s@dev </text>
      <text x="108.0" y="300" fill="#79c0ff"> ~ </text>
      <text x="133.2" y="300" fill="#7d8590">$ </text>
    </g>

    <!-- Blinking Cursor locked neatly beside the final prompt -->
    <rect x="150" y="286" width="8.4" height="17" fill="#d1d7e0" opacity="0.85">
      <animate attributeName="fill-opacity" values="1;0" dur="1s" repeatCount="indefinite" />
    </rect>
  </g>
  <rect x="0.5" y="0.5" width="859" height="364" rx="11.5" fill="none" stroke="#262c36" />
</svg>
