<svg xmlns="http://www.w3.org/2000/svg" width="860" height="240" viewBox="0 0 860 240" role="img" aria-label="Cyberpunk Neon Valley Banner">
  <defs>
    <clipPath id="banner-clip">
      <rect width="860" height="240" rx="12" />
    </clipPath>

    <!-- Deep Synthwave Sky -->
    <linearGradient id="sky-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0612" />
      <stop offset="60%" stop-color="#140c24" />
      <stop offset="100%" stop-color="#221338" />
    </linearGradient>

    <!-- Neon Sun Gradient -->
    <linearGradient id="sun-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7b00" />
      <stop offset="70%" stop-color="#ff0055" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>

    <!-- Grid Fade -->
    <linearGradient id="grid-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#140c24" stop-opacity="0" />
      <stop offset="100%" stop-color="#0a0612" stop-opacity="1" />
    </linearGradient>
  </defs>

  <g clip-path="url(#banner-clip)">
    <!-- Sky Background -->
    <rect width="860" height="240" fill="url(#sky-grad)" />

    <!-- Retro Glowing Sun -->
    <circle cx="430" cy="110" r="54" fill="url(#sun-grad)">
      <animate attributeName="r" values="52;56;52" dur="6s" repeatCount="indefinite" />
    </circle>
    <!-- Sun Horizontal Scanlines -->
    <g fill="#140c24">
      <rect x="370" y="118" width="120" height="3" />
      <rect x="380" y="125" width="100" height="2.5" />
      <rect x="395" y="131" width="70" height="2" />
      <rect x="410" y="136" width="40" height="1.5" />
    </g>

    <!-- Distant Mountain Ranges (Wireframe / Glow) -->
    <polygon points="0,170 140,105 280,150 430,95 590,145 740,110 860,160 860,240 0,240" fill="#1b0f30" />
    <polygon points="0,185 110,135 230,170 380,120 540,165 700,130 860,175 860,240 0,240" fill="#11081e" />

    <!-- Neon Horizon Grid Lines -->
    <g stroke="#ff007f" stroke-width="0.75" opacity="0.45">
      <line x1="0" y1="185" x2="860" y2="185" />
      <line x1="0" y1="195" x2="860" y2="195" />
      <line x1="0" y1="208" x2="860" y2="208" />
      <line x1="0" y1="223" x2="860" y2="223" />
      <line x1="0" y1="240" x2="860" y2="240" />
      <!-- Perspective rays -->
      <line x1="430" y1="185" x2="80" y2="240" />
      <line x1="430" y1="185" x2="220" y2="240" />
      <line x1="430" y1="185" x2="350" y2="240" />
      <line x1="430" y1="185" x2="510" y2="240" />
      <line x1="430" y1="185" x2="640" y2="240" />
      <line x1="430" y1="185" x2="780" y2="240" />
    </g>

    <!-- Bottom Vignette Fade -->
    <rect y="120" width="860" height="120" fill="url(#grid-fade)" pointer-events="none" />

    <!-- Status Text Top-Left -->
    <text x="24" y="32" fill="#a78bfa" font-family="ui-monospace, SFMono-Regular, &#39;SF Mono&#39;, Menlo, Consolas, monospace" font-size="12" letter-spacing="0.5">sys://sca4s/neon-grid</text>
    <!-- Pulsing Node Indicator Top-Right -->
    <circle cx="832" cy="28" r="4" fill="#00ffcc">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Border Frame -->
  <rect x="0.5" y="0.5" width="859" height="239" rx="11.5" fill="none" stroke="#3b2b5c" />
</svg>
