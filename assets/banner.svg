<svg xmlns="http://www.w3.org/2000/svg" width="860" height="230" viewBox="0 0 860 230" role="img" aria-label="sca4s banner: mysterious town in a foggy mountain valley">
  <defs>
    <clipPath id="banner-clip">
      <rect width="860" height="230" rx="12" />
    </clipPath>

    <!-- Night Sky Gradient -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06080e" />
      <stop offset="55%" stop-color="#0d1524" />
      <stop offset="100%" stop-color="#182438" />
    </linearGradient>

    <!-- Eerie Moon Glow -->
    <radialGradient id="moon-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dce8ff" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#8aa8d6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0d1524" stop-opacity="0" />
    </radialGradient>

    <!-- Valley Mist Gradients -->
    <linearGradient id="fog-grad-1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8fa8c8" stop-opacity="0" />
      <stop offset="25%" stop-color="#8fa8c8" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#b4cae6" stop-opacity="0.08" />
      <stop offset="75%" stop-color="#8fa8c8" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#8fa8c8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="fog-grad-2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6c84a6" stop-opacity="0" />
      <stop offset="35%" stop-color="#9bb4d4" stop-opacity="0.18" />
      <stop offset="65%" stop-color="#6c84a6" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#6c84a6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="bottom-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0f14" stop-opacity="0" />
      <stop offset="75%" stop-color="#0b0f14" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#0b0f14" stop-opacity="1" />
    </linearGradient>

    <filter id="blur-mist" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
  </defs>

  <g clip-path="url(#banner-clip)">
    <!-- Sky Background -->
    <rect width="860" height="230" fill="url(#sky)" />

    <!-- Twinkling Stars -->
    <g fill="#ffffff">
      <circle cx="75" cy="32" r="1" opacity="0.5"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="4s" repeatCount="indefinite" /></circle>
      <circle cx="145" cy="58" r="1.2" opacity="0.7"><animate attributeName="opacity" values="0.7;0.1;0.7" dur="5.5s" repeatCount="indefinite" /></circle>
      <circle cx="230" cy="24" r="0.9" opacity="0.4" />
      <circle cx="310" cy="48" r="1.3" opacity="0.6"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.8s" repeatCount="indefinite" /></circle>
      <circle cx="420" cy="28" r="1" opacity="0.5" />
      <circle cx="515" cy="44" r="1.4" opacity="0.8"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="6.2s" repeatCount="indefinite" /></circle>
      <circle cx="670" cy="22" r="1" opacity="0.4" />
      <circle cx="745" cy="52" r="1.2" opacity="0.7"><animate attributeName="opacity" values="0.2;0.75;0.2" dur="4.7s" repeatCount="indefinite" /></circle>
      <circle cx="810" cy="30" r="0.9" opacity="0.5" />
    </g>

    <!-- Moon & Atmospheric Halo -->
    <circle cx="585" cy="64" r="78" fill="url(#moon-glow)">
      <animate attributeName="r" values="74;84;74" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle cx="585" cy="64" r="16" fill="#e6f0ff" opacity="0.92" />

    <!-- Distant Mountain Range (Background) -->
    <polygon points="0,165 0,92 95,48 190,105 295,58 410,122 520,76 645,118 755,44 860,95 860,165" fill="#0e1726" />

    <!-- High Valley Fog Layer 1 (Drifting Right) -->
    <g filter="url(#blur-mist)" opacity="0.85">
      <ellipse cx="430" cy="126" rx="520" ry="22" fill="url(#fog-grad-1)">
        <animateTransform attributeName="transform" type="translate" values="-180,0; 180,0; -180,0" dur="26s" repeatCount="indefinite" />
      </ellipse>
    </g>

    <!-- Mid-Ground Steep Valley Slopes Framing the Town -->
    <polygon points="0,190 0,108 135,68 265,142 365,152 0,190" fill="#0b121e" />
    <polygon points="860,190 860,102 720,64 595,138 485,152 860,190" fill="#0b121e" />

    <!-- Mysterious Mountain Valley Town Silhouette -->
    <g fill="#070b12">
      <!-- Valley Floor Base -->
      <polygon points="180,195 250,150 620,150 690,195" />
      <!-- Gothic Clocktower / Spire in Center-Left -->
      <rect x="372" y="116" width="16" height="45" />
      <polygon points="369,116 380,82 391,116" />
      <!-- Steep-Roofed Valley Houses & lodges -->
      <rect x="290" y="142" width="24" height="22" />
      <polygon points="287,142 302,126 317,142" />
      <rect x="322" y="136" width="28" height="28" />
      <polygon points="319,136 336,118 353,136" />
      <rect x="352" y="144" width="18" height="20" />
      <polygon points="350,144 361,132 372,144" />
      <rect x="392" y="138" width="32" height="26" />
      <polygon points="389,138 408,120 427,138" />
      <rect x="428" y="132" width="26" height="32" />
      <polygon points="425,132 441,112 457,132" />
      <rect x="458" y="142" width="22" height="22" />
      <polygon points="455,142 469,127 483,142" />
      <rect x="486" y="136" width="30" height="28" />
      <polygon points="483,136 501,119 519,136" />
      <rect x="522" y="144" width="24" height="20" />
      <polygon points="520,144 534,130 548,144" />
      <!-- Viaduct / Old Arch Bridge on Right -->
      <rect x="548" y="146" width="65" height="6" />
      <rect x="556" y="152" width="6" height="14" />
      <rect x="576" y="152" width="6" height="14" />
      <rect x="596" y="152" width="6" height="14" />
    </g>

    <!-- Flickering Amber Town Windows & Lanterns -->
    <g fill="#f5a623">
      <!-- Clocktower face -->
      <circle cx="380" cy="124" r="2.6" fill="#ffd166">
        <animate attributeName="opacity" values="0.9;0.4;0.9" dur="5s" repeatCount="indefinite" />
      </circle>
      <!-- Town Windows -->
      <rect x="298" y="147" width="3" height="4" opacity="0.8"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="7s" repeatCount="indefinite" /></rect>
      <rect x="330" y="141" width="3" height="4.5" opacity="0.9" />
      <rect x="338" y="141" width="3" height="4.5" opacity="0.7"><animate attributeName="opacity" values="0.7;0.1;0.7" dur="4.3s" repeatCount="indefinite" /></rect>
      <rect x="359" y="149" width="3" height="4" opacity="0.85" />
      <rect x="401" y="143" width="3.5" height="4" opacity="0.9"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="6.1s" repeatCount="indefinite" /></rect>
      <rect x="410" y="143" width="3.5" height="4" opacity="0.75" />
      <rect x="436" y="138" width="3" height="5" opacity="0.85" />
      <rect x="443" y="146" width="3" height="4" opacity="0.6"><animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.9s" repeatCount="indefinite" /></rect>
      <rect x="467" y="147" width="3" height="4" opacity="0.8" />
      <rect x="495" y="142" width="3.5" height="4.5" opacity="0.9"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="8.4s" repeatCount="indefinite" /></rect>
      <rect x="503" y="142" width="3.5" height="4.5" opacity="0.7" />
      <rect x="531" y="149" width="3" height="3.5" opacity="0.75" />
      <!-- Bridge lights -->
      <circle cx="565" cy="145" r="1.2" fill="#ffd166" opacity="0.7" />
      <circle cx="585" cy="145" r="1.2" fill="#ffd166" opacity="0.8"><animate attributeName="opacity" values="0.8;0.3;0.8" dur="3.2s" repeatCount="indefinite" /></circle>
      <circle cx="605" cy="145" r="1.2" fill="#ffd166" opacity="0.7" />
    </g>

    <!-- Mid-Valley Rolling Fog Layer 2 (Drifting Left over the Town) -->
    <g filter="url(#blur-mist)">
      <ellipse cx="430" cy="154" rx="480" ry="20" fill="url(#fog-grad-2)">
        <animateTransform attributeName="transform" type="translate" values="160,0; -160,0; 160,0" dur="19s" repeatCount="indefinite" />
      </ellipse>
      <ellipse cx="380" cy="168" rx="540" ry="24" fill="url(#fog-grad-1)">
        <animateTransform attributeName="transform" type="translate" values="-140,0; 140,0; -140,0" dur="15s" repeatCount="indefinite" />
      </ellipse>
    </g>

    <!-- Foreground Pine Ridge Silhouettes (Left & Right) -->
    <path d="M0,230 L0,148 L18,162 L28,142 L42,165 L55,138 L72,168 L88,146 L104,172 L122,152 L140,178 L162,158 L185,182 L220,176 L260,192 L860,192 L860,230 Z" fill="#06090e" />
    <path d="M860,230 L860,142 L840,164 L825,138 L808,166 L792,144 L775,170 L758,148 L740,174 L722,155 L702,180 L680,162 L655,185 L610,192 L0,192 L0,230 Z" fill="#06090e" />

    <!-- Bottom Fade & Status Bar -->
    <rect y="155" width="860" height="75" fill="url(#bottom-fade)" />
    <text x="24" y="210" fill="#7d8590" font-family="ui-monospace, SFMono-Regular, &#39;SF Mono&#39;, Menlo, Consolas, &#39;Liberation Mono&#39;, monospace" font-size="11.5" letter-spacing="0.4">sca4s · silent valley · mist advisory</text>
    <circle cx="828" cy="206" r="3.5" fill="#a371f7">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Outer Frame Border -->
  <rect x="0.5" y="0.5" width="859" height="229" rx="11.5" fill="none" stroke="#262c36" />
</svg>
